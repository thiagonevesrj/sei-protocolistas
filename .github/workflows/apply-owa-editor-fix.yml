name: Aplicar correção editor OWA

on:
  push:
    branches:
      - agent/catalogo-fast-mail-amanha
    paths:
      - '.github/workflows/apply-owa-editor-fix.yml'
      - 'scripts/apply-owa-editor-fix.js'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: agent/catalogo-fast-mail-amanha
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar correção determinística
        run: node scripts/apply-owa-editor-fix.js

      - name: Validar correção
        run: npm run validate

      - name: Commitar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cs_modules/fast_mail/index.js cs_modules/fast_mail/baixa-restricao-direct-v1.js cs_modules/fast_mail/compose-html-guard-v1.js manifest.json package.json scripts/test-fast-mail-owa-editor.js
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "fix: usar corpo determinístico do OWA no FAST MAIL"
          git push origin HEAD:agent/catalogo-fast-mail-amanha
