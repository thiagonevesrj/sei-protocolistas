name: Patch local Marcos Lima

on:
  push:
    branches:
      - agent/local-marcos-lima-2026-09-11

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar excecao nominal
        run: python scripts/patch-marcos-lima-temp.py

      - name: Validar extensao
        run: |
          npm run validate
          git diff --check

      - name: Commitar patch de teste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add central_protocolista/main.js cs_modules/fast_mail/index.js
          git commit -m "feat: autorizar Marcos Lima como protocolista"
          git push origin HEAD:agent/local-marcos-lima-2026-09-11
